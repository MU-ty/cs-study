<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img"><title>Java Redis 调用链</title><desc>控制层调用业务服务，再经 StringRedisTemplate、Lettuce、TCP连接到 Redis；MySQL由业务服务独立访问。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#748881"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#edf4ef"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#243c37;font-size:14px}.small{font-size:12px;fill:#647b72}.title{font-size:21px;font-weight:bold}.box{fill:#fffefa;stroke:#bfd0c4;stroke-width:1.5}.edge{stroke:#748881;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="28" y="40" class="title" text-anchor="start">Java 接入：调用链与一致性边界</text><text x="28" y="69" class="small" text-anchor="start">Redis 和 MySQL 是独立资源，应用负责协调缓存失效。</text><rect x="45" y="108" width="155" height="65" rx="9" class="box"/><text x="122.5" y="140.5" class="" text-anchor="middle">Controller</text><text x="122.5" y="161.5" class="small" text-anchor="middle">HTTP 请求</text><rect x="315" y="108" width="165" height="65" rx="9" class="box"/><text x="397.5" y="140.5" class="" text-anchor="middle">Service</text><text x="397.5" y="161.5" class="small" text-anchor="middle">业务校验 / Cache Aside</text><rect x="600" y="108" width="155" height="65" rx="9" class="box"/><text x="677.5" y="140.5" class="" text-anchor="middle">MySQL</text><text x="677.5" y="161.5" class="small" text-anchor="middle">事实数据 / 事务</text><path d="M200 140 L312 140" class="edge"/><path d="M480 140 L597 140" class="edge"/><rect x="315" y="220" width="165" height="65" rx="9" class="box"/><text x="397.5" y="252.5" class="" text-anchor="middle">StringRedisTemplate</text><text x="397.5" y="273.5" class="small" text-anchor="middle">key / value 序列化</text><rect x="315" y="320" width="165" height="55" rx="9" class="box"/><text x="397.5" y="347.5" class="" text-anchor="middle">Lettuce</text><text x="397.5" y="368.5" class="small" text-anchor="middle">连接 / RESP</text><rect x="600" y="315" width="155" height="65" rx="9" class="box"/><text x="677.5" y="347.5" class="" text-anchor="middle">Redis</text><text x="677.5" y="368.5" class="small" text-anchor="middle">内存数据 / TTL</text><path d="M397 173 L397 217" class="edge"/><path d="M397 285 L397 317" class="edge"/><path d="M480 347 L597 347" class="edge"/><text x="535" y="337" class="small" text-anchor="start">TCP</text></svg>