<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img"><title>fork 与写时复制</title><desc>左侧父子进程共享页面；右侧父进程写入时复制页面，子进程仍读旧页面。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#748881"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#edf4ef"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#243c37;font-size:14px}.small{font-size:12px;fill:#647b72}.title{font-size:21px;font-weight:bold}.box{fill:#fffefa;stroke:#bfd0c4;stroke-width:1.5}.edge{stroke:#748881;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="28" y="40" class="title" text-anchor="start">RDB fork：先共享，写入时再复制</text><text x="28" y="72" class="small" text-anchor="start">① fork 后共享物理页</text><rect x="35" y="105" width="130" height="60" rx="9" class="box"/><text x="100.0" y="135.0" class="" text-anchor="middle">父进程</text><text x="100.0" y="156.0" class="small" text-anchor="middle">继续处理命令</text><rect x="35" y="215" width="130" height="60" rx="9" class="box"/><text x="100.0" y="245.0" class="" text-anchor="middle">子进程</text><text x="100.0" y="266.0" class="small" text-anchor="middle">生成快照</text><rect x="235" y="165" width="115" height="70" rx="9" class="box"/><text x="292.5" y="200.0" class="" text-anchor="middle">旧页面</text><text x="292.5" y="221.0" class="small" text-anchor="middle">value = 1</text><path d="M165 135 L235 185" class="edge"/><path d="M165 245 L235 205" class="edge"/><text x="420" y="72" class="small" text-anchor="start">② 父进程改写该页</text><rect x="425" y="105" width="130" height="60" rx="9" class="box"/><text x="490.0" y="135.0" class="" text-anchor="middle">父进程</text><text x="490.0" y="156.0" class="small" text-anchor="middle">value = 2</text><rect x="425" y="215" width="130" height="60" rx="9" class="box"/><text x="490.0" y="245.0" class="" text-anchor="middle">子进程</text><text x="490.0" y="266.0" class="small" text-anchor="middle">仍看到 value = 1</text><rect x="640" y="105" width="120" height="60" rx="9" class="box"/><text x="700.0" y="135.0" class="" text-anchor="middle">复制的新页</text><text x="700.0" y="156.0" class="small" text-anchor="middle">value = 2</text><rect x="640" y="215" width="120" height="60" rx="9" class="box"/><text x="700.0" y="245.0" class="" text-anchor="middle">原页面</text><text x="700.0" y="266.0" class="small" text-anchor="middle">value = 1</text><path d="M555 135 L638 135" class="edge"/><path d="M555 245 L638 245" class="edge"/><text x="28" y="335" class="small" text-anchor="start">写入多、页面改动多 → 额外内存上升；fork 自身也可能带来主线程停顿。</text></svg>