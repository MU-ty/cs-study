<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img"><title>跳表层级示意</title><desc>较高层跳过节点，底层保留有序节点。示例查询分数75，从高层推进至40，再在底层向75前进。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#748881"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#edf4ef"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#243c37;font-size:14px}.small{font-size:12px;fill:#647b72}.title{font-size:21px;font-weight:bold}.box{fill:#fffefa;stroke:#bfd0c4;stroke-width:1.5}.edge{stroke:#748881;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="28" y="40" class="title" text-anchor="start">跳表：高层跨越，底层完整</text><text x="28" y="66" class="small" text-anchor="start">示意分数 10、40、75、90；层数与晋升仅为演示</text><text x="25" y="147" class="" text-anchor="start">Level 2</text><rect x="122" y="118" width="76" height="45" rx="9" class="box"/><text x="160.0" y="145.5" class="" text-anchor="middle">HEAD</text><rect x="382" y="118" width="76" height="45" rx="9" class="box"/><text x="420.0" y="145.5" class="" text-anchor="middle">40</text><rect x="642" y="118" width="76" height="45" rx="9" class="box"/><text x="680.0" y="145.5" class="" text-anchor="middle">90</text><path d="M200 140 L378 140" class="edge"/><path d="M460 140 L638 140" class="edge"/><text x="25" y="217" class="" text-anchor="start">Level 1</text><rect x="122" y="188" width="76" height="45" rx="9" class="box"/><text x="160.0" y="215.5" class="" text-anchor="middle">HEAD</text><rect x="252" y="188" width="76" height="45" rx="9" class="box"/><text x="290.0" y="215.5" class="" text-anchor="middle">10</text><rect x="382" y="188" width="76" height="45" rx="9" class="box"/><text x="420.0" y="215.5" class="" text-anchor="middle">40</text><rect x="642" y="188" width="76" height="45" rx="9" class="box"/><text x="680.0" y="215.5" class="" text-anchor="middle">90</text><path d="M200 210 L248 210" class="edge"/><path d="M330 210 L378 210" class="edge"/><path d="M460 210 L638 210" class="edge"/><text x="25" y="287" class="" text-anchor="start">Level 0</text><rect x="122" y="258" width="76" height="45" rx="9" class="box"/><text x="160.0" y="285.5" class="" text-anchor="middle">HEAD</text><rect x="252" y="258" width="76" height="45" rx="9" class="box"/><text x="290.0" y="285.5" class="" text-anchor="middle">10</text><rect x="382" y="258" width="76" height="45" rx="9" class="box"/><text x="420.0" y="285.5" class="" text-anchor="middle">40</text><rect x="512" y="258" width="76" height="45" rx="9" class="box"/><text x="550.0" y="285.5" class="" text-anchor="middle">75</text><rect x="642" y="258" width="76" height="45" rx="9" class="box"/><text x="680.0" y="285.5" class="" text-anchor="middle">90</text><path d="M200 280 L248 280" class="edge"/><path d="M330 280 L378 280" class="edge"/><path d="M460 280 L508 280" class="edge"/><path d="M590 280 L638 280" class="edge"/><path d="M160 163 V188 M160 233 V258" stroke="#b8c9bd" stroke-dasharray="4 4"/><path d="M420 163 V188 M420 233 V258" stroke="#b8c9bd" stroke-dasharray="4 4"/><path d="M680 163 V188 M680 233 V258" stroke="#b8c9bd" stroke-dasharray="4 4"/><text x="28" y="330" class="small" text-anchor="start">字典按 member 定位；跳表按 score / member 顺序支持排名与范围遍历。</text></svg>