<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"><title>JDBC调用结构</title><desc>Controller调用Service编排事务，共享Connection交给DAO实现执行PreparedStatement，数据库提交后缓存独立失效。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7087aa"/></marker></defs><rect width="100%" height="100%" rx="15" fill="#eef3fb"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#253c63}.title{font-size:22px;font-weight:bold}.small{font-size:12px;fill:#6c7c99}.box{fill:#fffefa;stroke:#b5c5df;stroke-width:1.5}.edge{stroke:#7087aa;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="25" y="40" class="title" text-anchor="start">JDBC 工程：业务事务共享连接</text><text x="25" y="68" class="small" text-anchor="start">PreparedStatement 绑定参数；数据库事务不自动包含 Redis 操作</text><rect x="40" y="120" width="160" height="70" rx="10" class="box"/><text x="120.0" y="155.0" class="" text-anchor="middle">Controller</text><text x="120.0" y="175.0" class="small" text-anchor="middle">输入校验 / HTTP</text><rect x="325" y="120" width="180" height="70" rx="10" class="box"/><text x="415.0" y="155.0" class="" text-anchor="middle">Service</text><text x="415.0" y="175.0" class="small" text-anchor="middle">事务 / 业务编排</text><rect x="625" y="120" width="150" height="70" rx="10" class="box"/><text x="700.0" y="155.0" class="" text-anchor="middle">Redis</text><text x="700.0" y="175.0" class="small" text-anchor="middle">提交后失效</text><path d="M200 155 L322 155" class="edge"/><path d="M505 155 L622 155" class="edge"/><rect x="325" y="255" width="180" height="85" rx="10" class="box"/><text x="415.0" y="297.5" class="" text-anchor="middle">Connection c</text><text x="415.0" y="317.5" class="small" text-anchor="middle">autoCommit=false</text><path d="M415 190 L415 252" class="edge"/><rect x="50" y="270" width="160" height="65" rx="10" class="box"/><text x="130.0" y="302.5" class="" text-anchor="middle">DAO1</text><text x="130.0" y="322.5" class="small" text-anchor="middle">绑定 / SQL1</text><rect x="625" y="270" width="150" height="65" rx="10" class="box"/><text x="700.0" y="302.5" class="" text-anchor="middle">DAO2</text><text x="700.0" y="322.5" class="small" text-anchor="middle">绑定 / SQL2</text><path d="M325 290 L213 300" class="edge"/><path d="M505 290 L622 300" class="edge"/><text x="415" y="380" class="small" text-anchor="middle">DAO1 / DAO2 共用事务上下文，再由服务提交或回滚</text></svg>