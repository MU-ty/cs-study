<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"><title>集合接口层次</title><desc>Collection继承Iterable，List、Set、Queue继承Collection，Deque继承Queue。Map是独立的接口层次。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7087aa"/></marker></defs><rect width="100%" height="100%" rx="15" fill="#eef3fb"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#253c63}.title{font-size:22px;font-weight:bold}.small{font-size:12px;fill:#6c7c99}.box{fill:#fffefa;stroke:#b5c5df;stroke-width:1.5}.edge{stroke:#7087aa;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="25" y="40" class="title" text-anchor="start">集合契约：先看层次，再选择实现</text><text x="25" y="68" class="small" text-anchor="start">箭头表示父契约向子契约展开；Map 不属于 Collection</text><rect x="235" y="95" width="160" height="45" rx="10" class="box"/><text x="315.0" y="122.5" class="" text-anchor="middle">Iterable</text><rect x="235" y="170" width="160" height="45" rx="10" class="box"/><text x="315.0" y="197.5" class="" text-anchor="middle">Collection</text><path d="M315 140 L315 167" class="edge"/><rect x="45" y="260" width="140" height="60" rx="10" class="box"/><text x="115.0" y="290.0" class="" text-anchor="middle">List</text><text x="115.0" y="310.0" class="small" text-anchor="middle">ArrayList</text><rect x="245" y="260" width="140" height="60" rx="10" class="box"/><text x="315.0" y="290.0" class="" text-anchor="middle">Set</text><text x="315.0" y="310.0" class="small" text-anchor="middle">HashSet / TreeSet</text><rect x="445" y="260" width="140" height="60" rx="10" class="box"/><text x="515.0" y="290.0" class="" text-anchor="middle">Queue</text><text x="515.0" y="310.0" class="small" text-anchor="middle">队列契约</text><path d="M290 215 L115 257" class="edge"/><path d="M315 215 L315 257" class="edge"/><path d="M340 215 L515 257" class="edge"/><rect x="445" y="350" width="140" height="45" rx="10" class="box"/><text x="515.0" y="377.5" class="" text-anchor="middle">Deque</text><path d="M515 320 L515 347" class="edge"/><rect x="650" y="170" width="140" height="60" rx="10" class="box"/><text x="720.0" y="200.0" class="" text-anchor="middle">Map</text><text x="720.0" y="220.0" class="small" text-anchor="middle">HashMap / TreeMap</text><text x="720" y="260" class="small" text-anchor="middle">独立 key-value 层次</text></svg>