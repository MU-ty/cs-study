<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img"><title>JVM逻辑运行时与进程内存</title><desc>线程各自拥有JVM栈和程序计数器；对象和数组主要位于共享堆。进程还包含元数据、直接内存及本地库。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7087aa"/></marker></defs><rect width="100%" height="100%" rx="15" fill="#eef3fb"/><style>text{font-family:Arial,"Microsoft YaHei",sans-serif;font-size:14px;fill:#253c63}.title{font-size:22px;font-weight:bold}.small{font-size:12px;fill:#6c7c99}.box{fill:#fffefa;stroke:#b5c5df;stroke-width:1.5}.edge{stroke:#7087aa;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="25" y="40" class="title" text-anchor="start">JVM 内存：逻辑区域与进程边界</text><text x="25" y="68" class="small" text-anchor="start">这是教学逻辑模型，不能当作 JIT 后对象物理布局或固定地址</text><rect x="25" y="90" width="770" height="305" rx="13" fill="none" stroke="#b5c5df" stroke-dasharray="6 4"/><text x="45" y="114" class="small" text-anchor="start">Java 进程</text><rect x="55" y="145" width="190" height="90" rx="10" class="box"/><text x="150.0" y="190.0" class="" text-anchor="middle">线程 A</text><text x="150.0" y="210.0" class="small" text-anchor="middle">栈帧 / 局部变量 / PC</text><rect x="55" y="275" width="190" height="90" rx="10" class="box"/><text x="150.0" y="320.0" class="" text-anchor="middle">线程 B</text><text x="150.0" y="340.0" class="small" text-anchor="middle">栈帧 / 局部变量 / PC</text><rect x="335" y="190" width="205" height="125" rx="10" class="box"/><text x="437.5" y="252.5" class="" text-anchor="middle">共享堆</text><text x="437.5" y="272.5" class="small" text-anchor="middle">对象 / 数组</text><path d="M245 190 L332 226" class="edge"/><path d="M245 320 L332 275" class="edge"/><rect x="605" y="150" width="160" height="90" rx="10" class="box"/><text x="685.0" y="195.0" class="" text-anchor="middle">类型元数据</text><text x="685.0" y="215.0" class="small" text-anchor="middle">方法区 / 实现元数据</text><rect x="605" y="280" width="160" height="80" rx="10" class="box"/><text x="685.0" y="320.0" class="" text-anchor="middle">其他内存</text><text x="685.0" y="340.0" class="small" text-anchor="middle">直接内存 / 本地库</text><text x="335" y="360" class="small" text-anchor="start">-Xmx 只限制堆，非进程 RSS 总上限</text></svg>